name: Frontend CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"

    paths:
      - "versechat-ui/**"

  pull_request:
    branches:
      - main
      - dev

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: versechat-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: versechat-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc/@5.0.0 --ignore-scripts --noEmit

      - name: Build
        run: npm run build
