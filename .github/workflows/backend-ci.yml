name: VerseChat Backend CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"

    paths:
      - "versechat-backend/**"

  pull_request:
    branches:
      - main
      - dev

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: versechat-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy src/versechat_backend

      - name: Run tests
        run: uv run pytest
