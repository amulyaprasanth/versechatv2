name: "VerseChat"

services:

  frontend:
    build:
      context: ./versechat-ui
      dockerfile: Dockerfile

    depends_on:
      - api

    ports:
      - "3000:3000"

    networks:
      - versechat_net

  api:
    build:
      context: ./versechat-backend
      dockerfile: Dockerfile

    depends_on:
      - db
      
    ports:
      - "8000:8000"

    env_file:
      - .env
    networks:
      - versechat_net
      - versechat_db_net

  db:
    image: postgres:18

    volumes:
      - prod_data:/var/lib/postgresql

    env_file:
      - .env

    networks:
      - versechat_db_net

volumes:
  prod_data:


networks:
  versechat_net:
    driver: bridge

  versechat_db_net:
    driver: bridge
