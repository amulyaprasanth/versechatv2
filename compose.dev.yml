name: "versechat-dev"

services:
  frontend:
    build:
      context: ./versechat-ui
      dockerfile: Dockerfile.dev

    depends_on:
      - api

    ports:
      - "3000:3000"

    env_file:
      - versechat-ui/.env.dev
    volumes:
      - ./versechat-ui:/app:z
      - node_env:/app/node_modules:z
      - node_nex:/app/.next:z

    networks:
      - interservice_network

  api:
    build:
      context: ./versechat-backend
      dockerfile: Dockerfile.dev

    ports:
      - "8000:8000"

    volumes:
      - ./versechat-backend:/app:z
      - api_venv:/app/.venv:z

    env_file:
      - versechat-backend/.env.dev

    networks:
      - interservice_network

volumes:
  api_venv:
  node_env:
  node_nex:

networks:
  interservice_network:
    driver: bridge
