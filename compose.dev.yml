name: "versechat-dev"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-versechat}
      POSTGRES_USER: ${POSTGRES_USER:-versechat}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - interservice_network

  frontend:
    build:
      context: ./versechat-ui
      dockerfile: Dockerfile.dev

    depends_on:
      - api

    ports:
      - "3000:3000"

    env_file:
      - versechat-ui/.env.dev
    volumes:
      - ./versechat-ui:/app:z
      - node_env:/app/node_modules:z
      - node_nex:/app/.next:z

    networks:
      - interservice_network

  api:
    build:
      context: ./versechat-backend
      dockerfile: Dockerfile.dev

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - ./versechat-backend:/app:z
      - api_venv:/app/.venv:z

    env_file:
      - versechat-backend/.env.dev
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-versechat}
      POSTGRES_USER: ${POSTGRES_USER:-versechat}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

    networks:
      - interservice_network

volumes:
  api_venv:
  node_env:
  node_nex:
  postgres_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-.secrets/postgres_password}

networks:
  interservice_network:
    driver: bridge
